    <text x="110" y="59" font-family="Consolas, monospace" font-size="11" fill="#9fb0cf">index.html</text>

    <g font-family="Consolas, 'Courier New', monospace" font-size="13">
      <text x="48" y="96" fill="#5c6b8a">1</text>
      <text x="70" y="96" fill="#7aa2ff">&lt;html&gt;</text>
      <text x="48" y="118" fill="#5c6b8a">2</text>
      <text x="84" y="118" fill="#7aa2ff">&lt;body&gt;</text>
      <text x="48" y="140" fill="#5c6b8a">3</text>
      <text x="98" y="140" fill="#2dd4bf">&lt;h1&gt;</text>
      <text x="140" y="140" fill="#e8eefb">Hola</text>
      <text x="48" y="162" fill="#5c6b8a">4</text>
      <text x="98" y="162" fill="#2dd4bf">&lt;p&gt;</text>
      <text x="130" y="162" fill="#f9a8d4">class</text>
      <text x="168" y="162" fill="#e8eefb">=</text>
      <text x="176" y="162" fill="#fbbf24">"web"</text>
      <text x="48" y="184" fill="#5c6b8a">5</text>
      <text x="98" y="184" fill="#2dd4bf">&lt;img</text>
      <text x="136" y="184" fill="#f9a8d4">src</text>
      <text x="158" y="184" fill="#e8eefb">=</text>
      <text x="166" y="184" fill="#fbbf24">"img/"</text>
      <text x="48" y="206" fill="#5c6b8a">6</text>
      <text x="84" y="206" fill="#7aa2ff">&lt;/body&gt;</text>
